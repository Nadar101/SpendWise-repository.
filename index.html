
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>SpendWise</h1>
        <p>Track your expenses and manage your budget.</p>

        <div class="dashboard">
            <h2>Monthly Budget: KES <span id="budget">10000</span></h2>
            <h2>Total Expenses: KES <span id="total">0</span></h2>
            <h2>Remaining Budget: KES <span id="remaining">10000</span></h2>
            <p id="message">Your budget is looking good!</p>
        </div>

        <h2>Add an Expense</h2>

        <form id="expenseForm">
            <input type="text" id="expenseName" placeholder="Expense name" required>
            <input type="number" id="expenseAmount" placeholder="Amount (KES)" min="1" required>
            <button type="submit">Add Expense</button>
        </form>

        <h2>Expense Records</h2>
        <ul id="expenseList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
